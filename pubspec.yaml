name: my_skin_routine
description: "Your skincare companion — track products, routines & skin health."
publish_to: 'none'
version: 1.0.1+101

environment:
  sdk: ^3.11.3
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.5.0

  # Database
  drift: ^2.31.0
  path_provider: ^2.1.6
  path: ^1.9.1

  # Serialization / Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Images
  image_picker: ^1.2.4
  image: ^4.12.0

  # Notifications
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # File I/O
  archive: ^4.5.2
  file_picker: ^13.1.0
  share_plus: ^13.3.1

  # Preferences
  shared_preferences: ^2.5.6

  # Permissions
  permission_handler: ^13.0.2

  # UI
  dynamic_color: ^1.9.0
  flutter_animate: ^4.5.2

  # Utils
  uuid: ^4.6.0
  collection: ^1.19.1
  sqlite3_flutter_libs: ^0.5.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  drift_dev: ^2.31.0
  mockito: ^5.6.4
  build_verify: ^3.1.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/products/seed/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Thin.ttf
          weight: 100
        - asset: assets/fonts/Outfit-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Outfit-Black.ttf
          weight: 900
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
